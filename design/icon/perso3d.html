<!doctype html>
<html><head><meta charset="utf-8"><style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style></head>
<body>
<canvas id="c"></canvas>
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.js"}}</script>
<script type="module">
/* Rendu du VRAI personnage 3D seul, fond transparent, pour l'icône d'app (design/icon/build3d.py).
   Servi par le banc (même origine que /character/ et /vendor/). Paramètres dans l'adresse :
   ?s=1024 (taille) &yaw=-0.28 &pitch=0.12 (rotation de la tête) &fov=24 &ty=0.18 (cible au-dessus du centre : coupe le bas)
   &dist=6.2 &mode=win|open (expression) &t=2.2 (instant de l'animation, en s) */
import * as THREE from "three";
import {createCharacter} from "/character/redrock.js";
const P = new URLSearchParams(location.search), num = (k, d) => P.has(k) ? +P.get(k) : d;
const S_ = num("s", 1024);
const cv = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(S_, S_, false); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
// même lumière que la scène de l'app
scene.add(new THREE.HemisphereLight(0xfff4ee, 0x7a5a58, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-2.5, 5, 5); scene.add(key);
const rim = new THREE.PointLight(0xff2030, 18, 12); rim.position.set(3.5, 3, -2.5); scene.add(rim);
const rig = new THREE.Group(); scene.add(rig);
const props = new THREE.Group(); rig.add(props);
const mouse = new THREE.Group(); mouse.position.set(1.3, 0, 1.74); rig.add(mouse);
const mWheel = new THREE.Mesh(new THREE.CylinderGeometry(.026, .026, .03, 16), new THREE.MeshStandardMaterial()); mouse.add(mWheel);
const mLed = new THREE.Mesh(new THREE.BoxGeometry(.2, .01, .02), new THREE.MeshStandardMaterial({emissive: 0x303036})); mouse.add(mLed);
const hero = createCharacter({THREE, rig, renderer, desk: {mouse, M0: mouse.position.clone(), mWheel, mLed, pressNear() {}, screenW: 512}});
hero.mount({props, hitZone() {}});
const mode = P.get("mode") || "win";
const look = {x: 0, y: 0};
const S = () => ({act: "watching", alive: true, talking: false, win: mode === "win", danger: false, task: "", wide: false, chatOpen: true,
  unread: 0, outfit: {}, tama: {}, caress: false, look, generation: 2, fear: 0, content: true, crown: false, shades: false, bandage: false});
const camera = new THREE.PerspectiveCamera(num("fov", 24), 1, .1, 100);
// on fait tourner l'animation jusqu'à l'instant voulu (pas fixe : rendu identique à chaque fois)
const T = num("t", 2.2), dt = 1 / 60;
for (let i = 0, n = Math.round(T / dt); i <= n; i++) {
  const now = 1000 + i * dt * 1000, t = now / 1000, st = S();
  hero.update(dt, now, t, st); hero.updateHands(dt, now, t, st); hero.lateUpdate(dt);
}
// seule la tête (mains, tasse, téléphone cachés) ; elle se tourne un peu pour le mouvement
rig.children.forEach(o => { if (o !== hero.head) o.visible = false; });
const h = hero.head;
h.rotation.y = num("yaw", -.28); h.rotation.x = num("pitch", .12); h.rotation.z = num("roll", .06);
h.updateMatrixWorld(true);
const c = h.getWorldPosition(new THREE.Vector3());
camera.position.set(c.x + num("cx", 0), c.y + num("ty", .18) + num("cy", 0), c.z + num("dist", 6.2));
camera.lookAt(c.x + num("cx", 0), c.y + num("ty", .18), c.z);
renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
